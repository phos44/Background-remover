<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triumf Background Remover</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="workspace">
        <header class="header">
          <div>
            <p class="eyebrow">Triumf</p>
            <h1>Удаление фона</h1>
          </div>
          <a class="api-link" href="/docs" target="_blank" rel="noreferrer">API docs</a>
        </header>

        <section class="controls">
          <label class="control-field">
            <span>Модель</span>
            <select id="modelSelect" disabled>
              <option value="">Загрузка моделей...</option>
            </select>
          </label>
          <label class="control-toggle">
            <input id="alphaMatting" type="checkbox" />
            <span>Уточнение краёв (alpha matting)</span>
          </label>
          <label class="control-toggle">
            <input id="postProcessMask" type="checkbox" />
            <span>Сглаживание маски</span>
          </label>
        </section>

        <section class="upload-grid">
          <div id="dropZone" class="drop-zone">
            <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" />
            <div class="drop-content">
              <div class="upload-icon">+</div>
              <p>Перетащите изображение сюда или выберите файл</p>
              <button id="pickFile" class="secondary-button" type="button">Выбрать файл</button>
            </div>
          </div>

          <article class="preview-panel">
            <div class="panel-header">
              <h2>Исходник</h2>
              <span id="fileMeta">Файл не выбран</span>
            </div>
            <div class="image-frame checker">
              <img id="sourcePreview" alt="Исходное изображение" hidden />
            </div>
          </article>

          <article class="preview-panel">
            <div class="panel-header">
              <h2>Результат</h2>
              <span id="resultMeta">Ожидание</span>
            </div>
            <div class="image-frame checker">
              <div id="loader" class="loader" hidden></div>
              <img id="resultPreview" alt="Результат обработки" hidden />
            </div>
          </article>
        </section>

        <p id="status" class="status">Загрузите изображение для начала работы.</p>

        <footer class="actions">
          <div class="button-row">
            <button id="processButton" class="primary-button" type="button" disabled>
              Удалить фон
            </button>
            <a id="downloadButton" class="download-button disabled" download="background-removed.png">
              Скачать PNG
            </a>
          </div>
        </footer>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
